proxy_cache_path /var/cache/nginx/products
                  levels=1:2
                  keys_zone=products_cache:10m
                  max_size=1g
                  inactive=10m
                  use_temp_path=off;

upstream ozon_parser {
    server 127.0.0.1:8002 max_fails=1 fail_timeout=30s;
    server 127.0.0.1:8003 max_fails=1 fail_timeout=30s;
}

upstream ozon_parser_8002 {
    server 127.0.0.1:8002 max_fails=1 fail_timeout=30s;
}

upstream ozon_parser_8003 {
    server 127.0.0.1:8003 max_fails=1 fail_timeout=30s;
}

upstream ozon_core {
    server 127.0.0.1:8004 max_fails=1 fail_timeout=30s;
}

map $arg_service $refresh_backend {
    default "";
    ozon_parser_8002 http://ozon_parser_8002;
    ozon_parser_8003 http://ozon_parser_8003;
}

server {
    listen 8080;
    server_name localhost;

    location ~ ^/api/v1/force_refresh_cookies/?$ {
        return 403;
    }

    # Parser owns the products resource. This location must come before the
    # generic /api/v1/ block so the longest matching prefix wins and the cache
    # is actually applied.
    location /api/v1/products/ {
        proxy_pass http://ozon_parser;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 3s;
        proxy_read_timeout 90s;

        proxy_cache products_cache;
        proxy_cache_key "$uri|$arg_url|$arg_currency";
        proxy_cache_valid 200 30s;
        proxy_cache_valid 404 10s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating;

        add_header X-Cache-Status $upstream_cache_status;
    }

    # Ops endpoint of the parser instances (health / cookie refresh probes).
    location /api/v1/health/ {
        proxy_pass http://ozon_parser;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 3s;
        proxy_read_timeout 90s;
    }

    # Everything else under /api/v1/ is served by the core service.
    location /api/v1/ {
        proxy_pass http://ozon_core;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 3s;
        proxy_read_timeout 90s;
    }

    location = /force_refresh_cookies/ {
        if ($refresh_backend = "") {
            return 400 "Unknown service";
        }

        proxy_pass $refresh_backend/api/v1/force_refresh_cookies/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Connection "";

        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}
