upstream ozon_parser {
    server host.docker.internal:8002 max_fails=1 fail_timeout=30s;
    server host.docker.internal:8003 max_fails=1 fail_timeout=30s;
}

upstream ozon_parser_8002 {
    server host.docker.internal:8002 max_fails=1 fail_timeout=30s;
}

upstream ozon_parser_8003 {
    server host.docker.internal:8003 max_fails=1 fail_timeout=30s;
}

map $arg_service $refresh_backend {
    default "";
    ozon_parser_8002 http://ozon_parser_8002;
    ozon_parser_8003 http://ozon_parser_8003;
}

server {
    listen 80;
    server_name localhost;

    location /v1/ {
        proxy_pass http://ozon_parser;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 3s;
        proxy_read_timeout 90s;
    }

    location = /force_refresh_cookies/ {
        if ($refresh_backend = "") {
            return 400 "Unknown service";
        }

        proxy_pass $refresh_backend/v1/force_refresh_cookies/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Connection "";

        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}
