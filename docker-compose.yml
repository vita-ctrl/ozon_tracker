services:
  postgres:
    image: postgres:18.4
    container_name: ozon_tracker_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-ozon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ozon_tracker}
      POSTGRES_DB: ${DB_NAME:-ozon_tracker}
    ports:
      - "5431:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ozon} -d ${DB_NAME:-ozon_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: ozon_tracker_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

  nginx:
    image: nginx:1.31.6-alpine
    container_name: ozon_tracker_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-cache:/var/cache/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  nginx-cache:
