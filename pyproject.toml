[project]
name = "backend"
version = "0.1.0"
description = "Ozon Tracker Backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.30.0",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "curl-cffi>=0.15.0",
    "fastapi[standard]>=0.139.2",
    "nodriver>=0.50.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src"]
extraPaths = ["src"]

